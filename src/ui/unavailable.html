<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>ChaekOn</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
    html, body { margin: 0; background: #fff; }
    .card { width: 300px; padding: 14px 16px 16px; color: #1f2937; font-size: 13px; line-height: 1.5; }
    .head { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    .title { margin: 0 0 6px; font-size: 14px; font-weight: 700; color: #dc2626; }
    .desc { margin: 0; color: #4b5563; word-break: keep-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">ChaekOn</div>
    <p class="title" id="title">이 페이지에서는 사용할 수 없습니다</p>
    <p class="desc" id="desc">크롬 내부 페이지(chrome://)와 웹 스토어에서는 확장 프로그램이 동작할 수 없습니다. 전자책 뷰어를 연 탭에서 다시 눌러 주세요.</p>
  </div>
  <script src="unavailable.js"></script>
</body>
</html>
