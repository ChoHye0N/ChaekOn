name: Release

# v로 시작하는 태그를 올리면 확장 프로그램 zip을 만들어 GitHub 릴리스에 붙인다. 예: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: 태그와 manifest 버전이 같은지 확인
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 manifest.json의 version(v$VERSION)이 다릅니다." >&2
            exit 1
          fi

      # 확장 프로그램이 실제로 쓰는 파일만 묶는다(테스트, 스크립트, 문서는 제외).
      - name: 확장 폴더를 zip으로 묶기
        run: zip -r "chaekon-$GITHUB_REF_NAME.zip" manifest.json src assets/icons

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## 설치 (개발자 모드)

          1. 아래 `chaekon-*.zip`을 내려받아 폴더에 풉니다.
          2. 크롬에서 `chrome://extensions`를 열고 **개발자 모드**를 켭니다.
          3. **압축해제된 확장 프로그램을 로드합니다**를 눌러 푼 폴더를 고릅니다.

          자세한 사용법과 권한 안내는 README를 참고하세요.
          EOF
          gh release create "$GITHUB_REF_NAME" "chaekon-$GITHUB_REF_NAME.zip" \
            --title "ChaekOn $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
